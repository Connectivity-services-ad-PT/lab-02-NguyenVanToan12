openapi: 3.1.0

info:
  title: Smart Campus Alert API
  version: 1.0.0
  description: REST API for Smart Campus alerts

servers:
  - url: http://localhost:4010

paths:

  /health:
    get:
      summary: Health check
      operationId: healthCheck

      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /alerts/recent:
    get:
      summary: Get recent alerts
      operationId: getRecentAlerts

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Recent alerts

          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

        '401':
          description: Unauthorized

          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /alerts:
    post:
      summary: Create alert
      operationId: createAlert

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'

      responses:
        '201':
          description: Alert created

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'

        '400':
          description: Invalid request

          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /alerts/{alertId}:
    get:
      summary: Get alert by id
      operationId: getAlertById

      parameters:
        - name: alertId
          in: path
          required: true

          schema:
            type: string

      responses:
        '200':
          description: Alert detail

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'

        '404':
          description: Alert not found

          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    HealthResponse:
      type: object

      properties:
        status:
          type: string
          example: UP

    Alert:
      type: object

      required:
        - id
        - title
        - severity

      properties:

        id:
          type: string
          example: ALT-001

        title:
          type: string

        severity:
          type: string

          enum:
            - LOW
            - MEDIUM
            - HIGH

    CreateAlertRequest:
      type: object

      required:
        - title
        - severity

      properties:

        title:
          type: string

        severity:
          type: string

          enum:
            - LOW
            - MEDIUM
            - HIGH

        description:
          type:
            - string
            - "null"

    AlertDetail:
      oneOf:
        - $ref: '#/components/schemas/FireAlert'
        - $ref: '#/components/schemas/SecurityAlert'

      discriminator:
        propertyName: alertType

    FireAlert:
      type: object

      properties:

        alertType:
          type: string
          const: FIRE

        id:
          type: string

        location:
          type: string

        temperature:
          type: number

    SecurityAlert:
      type: object

      properties:

        alertType:
          type: string
          const: SECURITY

        id:
          type: string

        cameraId:
          type: string

        suspectDetected:
          type: boolean

    ProblemDetails:
      type: object

      properties:

        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string